name: keeptang
description: KeepTang (เก็บตัง) — แอปบันทึกรายรับ-รายจ่ายส่วนบุคคล
publish_to: 'none'

version: 1.4.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: any
  fl_chart: any
  firebase_core: any
  cloud_firestore: any
  flutter_native_splash: any
  shared_preferences: ^2.5.5
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.1
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  photo_manager: ^3.12.0
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/app_icon_foreground.png
    - assets/splash_bill_cat_theme.png
    - assets/splash_bill_cat_theme_dark.png
    - assets/splash_bill_base.png
    - assets/splash_bill_base_dark.png

flutter_launcher_icons:
  android: "keeptang_icon"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0A665E"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#0A665E"
    theme_color: "#0A665E"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/app_icon.png"
  color_dark: "#121212"
  image_dark: "assets/app_icon.png"
  android: true
  ios: true
  android_12:
    color: "#ffffff"
    image: "assets/app_icon.png"
    color_dark: "#121212"
    image_dark: "assets/app_icon.png"
