name: keeptang
description: KeepTang (เก็บตัง) — แอปบันทึกรายรับ-รายจ่ายส่วนบุคคล
publish_to: 'none'

version: 1.4.5+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: any
  fl_chart: any
  firebase_core: any
  cloud_firestore: any
  shared_preferences: ^2.5.5
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.1
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  photo_manager: ^3.12.0
  flutter_svg: ^2.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: any
flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.svg
    - assets/branding/app_icon.svg
    - assets/branding/loading_rings.svg
    - assets/branding/loading_receipt.svg

flutter_launcher_icons:
  android: "keeptang_receipt"
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/branding/logo_foreground.png"
  adaptive_icon_monochrome: "assets/branding/logo_foreground.png"
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true
  background_color_ios: "#0A665E"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#0A665E"
    theme_color: "#0A665E"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"

flutter_native_splash:
  color: "#0A665E"
  image: "assets/branding/splash.png"
  color_dark: "#0A665E"
  image_dark: "assets/branding/splash.png"
  android: true
  ios: true
  android_12:
    color: "#0A665E"
    image: "assets/branding/splash_android12.png"
    color_dark: "#0A665E"
    image_dark: "assets/branding/splash_android12.png"
