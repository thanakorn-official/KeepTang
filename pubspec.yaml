name: keeptang
description: KeepTang (เก็บตัง) — แอปบันทึกรายรับ-รายจ่ายส่วนบุคคล
publish_to: 'none'

version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: any
  fl_chart: any
  firebase_core: any
  cloud_firestore: any
  flutter_native_splash: any
  shared_preferences: ^2.5.5
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash_cat_face.png
    - assets/splash_bill_cat_theme.png
    - assets/splash_bill_cat_theme_dark.png
    - assets/splash_bill_base.png
    - assets/splash_bill_base_dark.png
    - assets/splash_cat_peek.png

flutter_launcher_icons:
  android: "keeptang_icon"
  ios: true
  image_path: "assets/splash_bill_base.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/splash_bill_base.png"
  adaptive_icon_monochrome: "assets/splash_bill_base.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/splash_bill_base.png"
    background_color: "#ffffff"
    theme_color: "#007AFF"
  windows:
    generate: true
    image_path: "assets/splash_bill_base.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/splash_bill_base.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/splash_bill_base.png"
  color_dark: "#121212"
  image_dark: "assets/splash_bill_base_dark.png"
  android: true
  ios: true
  android_12:
    color: "#ffffff"
    image: "assets/splash_bill_base.png"
    color_dark: "#121212"
    image_dark: "assets/splash_bill_base_dark.png"
